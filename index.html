<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Conectar no CS</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14152a; color: #f2f2f7; font: 16px/1.5 system-ui, "Segoe UI", sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    a.button { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 8px; background: #27ae60; color: #fff; font-weight: 700; text-decoration: none; }
    code { display: block; margin-top: 16px; padding: 10px; border-radius: 6px; background: #1d1f38; color: #a3a6c2; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Abrindo o CS...</h1>
    <p id="hint">Se o navegador perguntar, permita abrir o Steam.</p>
    <a class="button" id="connect" href="#">Conectar no CS</a>
    <code id="command"></code>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const ip = params.get("ip") || "";
    const password = params.get("pw") || "";
    const valid = /^[\w.-]+:\d{2,5}$/.test(ip) && /^[^\s"'<>/]*$/.test(password);
    if (!valid) {
      document.getElementById("title").textContent = "Link inválido";
      document.getElementById("hint").textContent = "Faltou o IP da partida.";
      document.getElementById("connect").remove();
    } else {
      const steamUrl = `steam://connect/${ip}${password ? `/${encodeURIComponent(password)}` : ""}`;
      document.getElementById("connect").href = steamUrl;
      document.getElementById("command").textContent = password ? `connect ${ip};password ${password}` : `connect ${ip}`;
      location.href = steamUrl;
    }
  </script>
</body>
</html>
